name: iOS (unsigned IPA)

# 给没有 Mac 的个人用户出未签名 iOS 包，再用 AltStore / Sideloadly
# 以自己的免费 Apple ID 签名装到 iPhone 上自用。
# 用法：把本文件放进 fork 后的仓库 .github/workflows/ios.yml，
# 在 GitHub 网页上 Actions -> iOS (unsigned IPA) -> Run workflow，
# 跑完在 Artifacts 里下载 HGhub-ios-unsigned。
#
# 注意：本文件只在 GitHub 的 macOS runner 上跑，不用你本地有 Mac，
# 也不需要任何 Apple 证书 / 密码 / secret。

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: pnpm install --frozen-lockfile

      - name: 准备 xcodegen（如 runner 未预装）
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # 关键教训（已实测两次失败确认）：
      # Xcode 构建阶段跑的是 `npm run tauri ios xcode-script`，即仓库
      # node_modules 里的 CLI；而 2.10.1 与 2.12.x 传递构建参数的机制完全不同
      #（2.10.1 用 $TMPDIR/<id>-server-addr 文件，2.12.x 用
      # gen/apple/.tauri/cli-options-server.json）。父进程与子进程版本不一致
      # 就会在 "failed to read missing addr file ...-server-addr" 处 panic、
      # ARCHIVE FAILED。所以必须把本地 CLI 也统一到 2.12.4，并且打印版本号验证。
      # 注意：之前用 `pnpm add @tauri-apps/cli@^2` 升级的那步虽然显示成功，
      # 但实际跑起来的仍是 2.10.1，因此这里先 rm 再精确安装，并校验二进制版本。
      - name: 统一本地 Tauri CLI 到 2.12.4（并校验版本）
        run: |
          pnpm rm @tauri-apps/cli || true
          pnpm add -D @tauri-apps/cli@2.12.4 --save-exact
          echo "package.json: $(node -p "require('./package.json').devDependencies['@tauri-apps/cli']")"
          echo "node_modules 包版本: $(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"
          pnpm exec tauri --version
          test "$(pnpm exec tauri --version | grep -o '[0-9.]*' | head -1)" = "2.12.4" || (echo "本地 CLI 不是 2.12.4，停止" && exit 1)

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      # 生成器可能把部署目标写死成 14.0，新版 Xcode 不接受，改成 15.0
      #（与仓库 tauri.ios.conf.json 里的 minimumSystemVersion 一致）。
      - name: 修正部署目标（若生成器写死 14.0）
        run: |
          f=src-tauri/gen/apple/project.yml
          if [ -f "$f" ]; then
            sed -i '' '/IPHONEOS_DEPLOYMENT_TARGET/s/14\.0/15.0/' "$f" || true
            grep -n "IPHONEOS_DEPLOYMENT_TARGET" "$f" || true
          fi

      # 生成器不读 src-tauri/icons/ios，AppIcon 会是占位图；把仓库里现成的
      # iOS 图标拷过去覆盖。
      - name: 换上仓库自带的 iOS 图标
        run: |
          ICONSET=$(find src-tauri/gen/apple -name "AppIcon.appiconset" -type d | head -1)
          if [ -n "${ICONSET:-}" ]; then
            cp src-tauri/icons/ios/AppIcon-*.png "$ICONSET/" 2>/dev/null || true
            ls "$ICONSET" | head -5
          else
            echo "未找到 AppIcon.appiconset，跳过（将使用占位图标）"
          fi

      - name: 构建（不签名，本地 CLI 与 Xcode 脚本同一版本）
        run: pnpm tauri ios build --no-sign --ci

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          # CLI 自己可能已产出 .ipa，直接拿来用
          IPA=$(find src-tauri/gen/apple -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "${IPA:-}" ]; then
            echo "CLI 已产出 $IPA"
            cp "$IPA" HGhub-unsigned.ipa
            ls -lh HGhub-unsigned.ipa
            exit 0
          fi
          # 否则从 .app 手工打包；archive 产物可能在 DerivedData/Archives 里
          APP=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData ~/Library/Developer/Xcode/Archives -name "HGhub.app" -type d 2>/dev/null | head -1)
          if [ -z "${APP:-}" ]; then
            echo "找不到 HGhub.app，列出候选："
            find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head
            exit 1
          fi
          echo "找到 $APP"
          rm -rf Payload HGhub-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload HGhub-unsigned.ipa
          ls -lh HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-unsigned
          path: HGhub-unsigned.ipa
          if-no-files-found: error
